<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kikina · Questionnaire</title>
<style>
  @font-face { font-family: "Whyte Inktrap"; src: url("fonts/WhyteInktrap-Light.ttf?v=2") format("truetype"); font-weight: 300; font-display: swap; }
  @font-face { font-family: "Whyte Inktrap"; src: url("fonts/WhyteInktrap-Regular.ttf?v=2") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Whyte Inktrap"; src: url("fonts/WhyteInktrap-Medium.ttf?v=2") format("truetype"); font-weight: 500; font-display: swap; }

  :root {
    --fond: #faf8f4;
    --carte: #ffffff;
    --texte: #111111;
    --texte-doux: #7a766f;
    --texte-pale: #a8a39a;
    --ligne: #e3dfd7;
    --ligne-moyenne: #cfcac0;
    --erreur: #9a3b2e;
    --police: "Whyte Inktrap", "Helvetica Neue", Arial, sans-serif;
    --fond-barre: rgba(250, 248, 244, .92);
    --courbe: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--fond); color: var(--texte);
    font-family: var(--police); font-weight: 300; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }

  /* Nuit : couleurs inversées pour la partie sommeil */
  body { transition: background-color .9s ease, color .9s ease; }
  body.nuit {
    --fond: #101114; --carte: #17181c; --texte: #f1ede6; --texte-doux: #a7a299; --texte-pale: #6f6b64;
    --ligne: #2a2b31; --ligne-moyenne: #3d3e45; --fond-barre: rgba(16, 17, 20, .92);
  }
  body.nuit .duo img { filter: invert(1); }
  body.nuit .tuile:hover { box-shadow: none; }

  /* Cadre : photo à gauche, parcours à droite */
  .cadre { display: flex; min-height: 100vh; min-height: 100dvh; }
  .visuel { position: sticky; top: 0; flex: none; width: 44%; height: 100vh; height: 100dvh; overflow: hidden; background: #e9e4da; }
  .visuel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.06); transition: opacity 1.4s var(--courbe), transform 9s ease-out; }
  .visuel img.on { opacity: 1; transform: scale(1); }
  .visuel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,0) 60%, rgba(17,17,17,.18)); pointer-events: none; }
  .sans-visuel .visuel { display: none; }
  .colonne { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  button { font: inherit; }
  img { display: block; }

  /* Barre du haut */
  .barre { position: sticky; top: 0; z-index: 5; background: var(--fond-barre); transition: background-color .8s; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .barre-int { padding: 24px 40px 18px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .barre-int .duo { grid-column: 2; }
  .barre-int .compteur { grid-column: 3; justify-self: end; }
  .duo { display: flex; align-items: center; gap: 16px; }
  .duo .kikina { height: 15px; width: auto; }
  .duo .client { height: 22px; width: auto; }
  .duo .croix { width: 9px; height: 9px; position: relative; opacity: .5; }
  .duo .croix::before, .duo .croix::after { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: var(--texte); }
  .duo .croix::before { transform: rotate(45deg); }
  .duo .croix::after { transform: rotate(-45deg); }
  .compteur { font-size: 12px; letter-spacing: .14em; color: var(--texte-doux); font-variant-numeric: tabular-nums; }
  .progression { padding: 0 40px; display: flex; gap: 4px; height: 2px; }
  .progression span { flex: 1; background: var(--ligne); transition: background .5s var(--courbe); }
  .progression span.fait { background: var(--texte); }
  .progression span.coupure { margin-left: 10px; }
  .barre.cachee .progression, .barre.cachee .compteur, .barre.cachee .duo { visibility: hidden; }

  /* Scène */
  main { flex: 1; display: flex; }
  .scene { flex: 1; width: 100%; max-width: 680px; margin: 0 auto; padding: 7vh 40px 56px; display: flex; flex-direction: column; justify-content: center; }
  .entre { animation: entre .6s var(--courbe) both; }
  @keyframes entre { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .surtitre { font-size: 12px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; color: var(--texte-doux); margin: 0 0 28px; display: flex; gap: 14px; }
  .surtitre .num { color: var(--texte-pale); }

  /* Accueil */
  .accueil { text-align: center; align-items: center; }
  .accueil .duo { gap: 28px; margin-bottom: 72px; }
  .accueil .duo .kikina { height: 26px; }
  .accueil .duo .client { height: 40px; }
  .accueil .duo .croix { width: 14px; height: 14px; }
  .accueil h1 { font-weight: 300; font-size: clamp(38px, 7vw, 60px); line-height: 1.05; letter-spacing: -.015em; margin: 0 0 22px; }
  .accueil .format { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--texte-doux); margin: 0 0 56px; }
  .onde { display: flex; align-items: center; justify-content: center; gap: 5px; height: 40px; margin: 0 0 56px; }
  .onde i { display: block; width: 2px; border-radius: 2px; background: var(--texte); opacity: .8; animation: onde 2.4s ease-in-out infinite; }
  @keyframes onde { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  .etapes { list-style: none; padding: 0; margin: 0 auto 64px; width: 100%; max-width: 440px; text-align: left; border-top: 1px solid var(--ligne); }
  .etapes li { display: flex; align-items: baseline; gap: 18px; padding: 16px 2px; border-bottom: 1px solid var(--ligne); font-size: 16px; }
  .etapes .num { font-size: 12px; letter-spacing: .1em; color: var(--texte-pale); }
  .etapes .nb { margin-left: auto; font-size: 13px; color: var(--texte-doux); }

  /* Question */
  .question h2 { font-weight: 300; font-size: clamp(26px, 4.4vw, 38px); line-height: 1.2; letter-spacing: -.01em; margin: 0 0 44px; max-width: 24ch; }
  .question h2.long { max-width: 30ch; font-size: clamp(24px, 3.8vw, 32px); }
  .question h2 .requis { color: var(--texte-pale); }
  .question h2.avec-points { margin-bottom: 24px; }
  .points { list-style: none; padding: 0; margin: 0 0 36px; border-top: 1px solid var(--ligne); }
  .points li { display: flex; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--ligne); font-size: 17px; line-height: 1.45; }
  .points li span { flex: none; font-size: 12px; letter-spacing: .1em; color: var(--texte-pale); padding-top: 4px; }

  .tuiles { display: grid; gap: 12px; }
  .tuile {
    position: relative; display: flex; align-items: center; gap: 18px; width: 100%; text-align: left; cursor: pointer;
    background: var(--carte); border: 1px solid var(--ligne); border-radius: 2px; padding: 20px 22px; color: var(--texte);
    font-size: 17px; font-weight: 300; line-height: 1.35; transition: border-color .25s, box-shadow .25s, transform .15s;
  }
  .tuile:hover { border-color: var(--ligne-moyenne); box-shadow: 0 6px 24px rgba(17, 17, 17, .05); }
  .tuile:active { transform: scale(.995); }
  .tuile:focus-visible { outline: 1px solid var(--texte); outline-offset: 3px; }
  .tuile .touche { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--ligne-moyenne); font-size: 11px; font-weight: 400; color: var(--texte-doux); transition: all .25s; }
  .tuile.multi .touche { border-radius: 0; }
  .tuile.choisie { border-color: var(--texte); }
  .tuiles.compactes { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
  .tuiles.compactes .tuile { justify-content: center; text-align: center; padding: 14px 12px; font-size: 15px; }
  .tuiles.compactes .tuile.choisie { background: var(--texte); color: var(--fond); }
  .groupe { list-style: none; padding: 0; margin: 0; display: grid; gap: 34px; }
  .groupe-label { display: flex; gap: 14px; margin: 0 0 14px; font-size: 17px; line-height: 1.45; }
  .groupe-label span { flex: none; font-size: 12px; letter-spacing: .1em; color: var(--texte-pale); padding-top: 4px; }
  .groupe .saisie { font-size: 18px; padding: 6px 0 10px; }
  .avec-icone { position: relative; }
  .avec-icone .icone { position: absolute; left: 0; top: 50%; transform: translateY(-58%); color: var(--texte-doux); display: flex; }
  .avec-icone .saisie { padding-left: 38px; }
  .accroche { max-width: 46ch; margin: 0 auto 44px; color: var(--texte-doux); font-size: 15px; line-height: 1.6; }
  .tuile-texte { display: flex; flex-direction: column; gap: 4px; }
  .tuile-texte small { font-size: 14px; color: var(--texte-doux); line-height: 1.4; }
  .tuile.choisie .touche { background: var(--texte); border-color: var(--texte); color: var(--fond); }

  .saisie { width: 100%; font: inherit; font-weight: 300; color: var(--texte); background: transparent; border: 0; border-bottom: 1px solid var(--ligne-moyenne); border-radius: 0; outline: none; transition: border-color .25s; -webkit-appearance: none; appearance: none; }
  input.saisie { font-size: clamp(22px, 3.4vw, 28px); line-height: 1.4; height: auto; padding: 8px 0 12px; }
  textarea.saisie { font-size: 20px; line-height: 1.5; padding: 8px 0 12px; min-height: 140px; resize: vertical; }
  .saisie::placeholder { color: var(--texte-pale); opacity: 1; }
  .saisie:focus { border-bottom-color: var(--texte); }
  .autre { margin-top: 18px; }
  .autre .saisie { font-size: 17px; padding: 8px 0 10px; }

  .actions { display: flex; align-items: center; gap: 22px; margin-top: 48px; flex-wrap: wrap; }
  .bouton {
    display: inline-flex; align-items: center; gap: 14px; cursor: pointer; text-decoration: none;
    font-size: 12px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase;
    color: var(--fond); background: var(--texte); border: 1px solid var(--texte); border-radius: 0; padding: 18px 34px; transition: opacity .2s;
  }
  .bouton:hover { opacity: .86; }
  .bouton:disabled { opacity: .4; cursor: wait; }
  .bouton.leger { background: transparent; color: var(--texte); }
  .lien { background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--texte-doux); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .lien:hover { color: var(--texte); }
  .aide { font-size: 12px; color: var(--texte-pale); letter-spacing: .04em; }
  .aide kbd { font: inherit; border: 1px solid var(--ligne-moyenne); padding: 1px 6px; }
  .erreur { color: var(--erreur); font-size: 14px; margin-top: 16px; min-height: 1em; }

  /* Récapitulatif */
  .recap h2 { font-weight: 300; font-size: clamp(30px, 5vw, 42px); margin: 0 0 48px; letter-spacing: -.01em; }
  .recap-section { margin: 0 0 36px; }
  .recap-section h3 { font-size: 12px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; color: var(--texte-doux); margin: 0 0 6px; padding-bottom: 12px; border-bottom: 1px solid var(--ligne); }
  .recap-ligne { display: grid; grid-template-columns: 1fr auto; gap: 4px 24px; padding: 16px 0; border-bottom: 1px solid var(--ligne); }
  .recap-ligne .ql { font-size: 14px; color: var(--texte-doux); }
  .recap-ligne .rep { grid-column: 1; font-size: 17px; white-space: pre-wrap; }
  .recap-ligne .rep.vide { color: var(--texte-pale); }
  .recap-ligne .lien { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .prenom { margin: 8px 0 0; max-width: 360px; }
  .prenom label { display: block; font-size: 12px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; color: var(--texte-doux); margin-bottom: 6px; }
  .prenom .saisie { font-size: 20px; padding: 6px 0 10px; }

  /* Fin */
  .fin { text-align: center; align-items: center; }
  .fin .duo { gap: 28px; margin-bottom: 64px; }
  .fin .duo .kikina { height: 22px; }
  .fin .duo .client { height: 34px; }
  .fin h2 { font-weight: 300; font-size: clamp(38px, 7vw, 60px); margin: 0 0 20px; letter-spacing: -.015em; }
  .fin p { color: var(--texte-doux); max-width: 46ch; margin: 0 auto; }
  .fin .actions { justify-content: center; }

  footer { width: 100%; padding: 20px 40px 28px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--texte-pale); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  footer a { color: inherit; text-decoration: none; }

  @media (max-width: 900px) {
    .cadre { flex-direction: column; }
    .visuel { position: relative; width: 100%; height: 38vh; transition: height .8s var(--courbe); }
    body.en-question .visuel { height: 128px; }
    .scene { padding: 48px 28px 48px; justify-content: flex-start; }
    .barre-int { padding: 18px 28px 14px; }
    .progression { padding: 0 28px; }
    footer { padding: 20px 28px 28px; }
  }
  @media (max-width: 560px) {
    .barre-int { padding: 16px 20px 14px; }
    .progression { padding: 0 20px; }
    .duo .kikina { height: 13px; }
    .duo .client { height: 18px; }
    .scene { padding: 40px 20px 48px; justify-content: flex-start; }
    .accueil { padding-top: 40px; }
    .accueil .duo { margin-bottom: 52px; }
    .accueil .duo .kikina { height: 21px; }
    .accueil .duo .client { height: 32px; }
    .tuile { padding: 17px 18px; font-size: 16px; }
    .bouton { width: 100%; justify-content: center; }
    .aide { display: none; }
    footer { padding: 16px 20px 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .entre, .onde i { animation: none; }
  }
</style>
</head>
<body>
<div class="cadre sans-visuel" id="cadre">
<aside class="visuel" aria-hidden="true"><img alt="" id="img-a"><img alt="" id="img-b"></aside>
<div class="colonne">
<div class="barre cachee" id="barre">
  <div class="barre-int">
    <div class="duo" id="duo-barre"></div>
    <div class="compteur" id="compteur"></div>
  </div>
  <div class="progression" id="progression"></div>
</div>

<main id="app"><div class="scene"><p class="aide">Chargement</p></div></main>

<footer>
  <span>Composé avec des neuroscientifiques</span>
  <a href="https://kikina.fr" target="_blank" rel="noopener">kikina.fr</a>
</footer>
</div>
</div>

<script>
(function () {
  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  const id = (params.get("q") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
  const CONTACT = '<a style="color:inherit" href="mailto:bianca@kikinastudio.com">bianca@kikinastudio.com</a>';

  if (!id) return message("Ce lien est incomplet. Écrivez-nous à " + CONTACT + ".");
  // Réglages puis questions, toujours dans leur dernière version (sans attendre le cache du navigateur).
  function charger(src, ok, ko) {
    const s = document.createElement("script");
    s.src = src + "?t=" + Date.now();
    s.onload = ok; s.onerror = ko;
    document.body.appendChild(s);
  }
  const lancer = () => charger("questionnaires/" + id + ".js",
    () => window.QUESTIONNAIRE ? demarrer(window.QUESTIONNAIRE) : introuvable(), introuvable);
  charger("config.js", lancer, lancer);

  function introuvable() { message("Ce questionnaire n'existe plus ou le lien est incorrect. Écrivez-nous à " + CONTACT + "."); }
  function message(html) { app.innerHTML = '<div class="scene"><p style="max-width:46ch;color:var(--texte-doux)">' + html + "</p></div>"; }

  function el(tag, attrs, ...enfants) {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    enfants.flat().forEach(c => c != null && c !== false && n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return n;
  }

  function demarrer(Q) {
    const CFG = window.KIKINA_CONFIG || {};
    const cle = "kikina-questionnaire-" + Q.id;
    const barre = document.getElementById("barre");
    const compteur = document.getElementById("compteur");
    const progression = document.getElementById("progression");
    document.title = "Kikina · " + Q.client;

    // Questions à plat, chacune avec sa section.
    const toutes = [];
    Q.sections.forEach((sec, i) => sec.questions.forEach(q => toutes.push(Object.assign({}, q, { _sec: i }))));

    // Empreinte des questions : si le questionnaire a changé depuis la dernière visite, on repart de l'accueil.
    const empreinte = JSON.stringify(toutes.map(q => [q.id, q.type, q.siReponse || 0]));
    let etat = { r: {}, pos: -1, recapApres: false, empreinte };
    try {
      const ancien = JSON.parse(localStorage.getItem(cle) || "{}");
      if (ancien.empreinte === empreinte) Object.assign(etat, ancien);
    } catch (e) {}
    const R = etat.r;
    toutes.forEach(q => {
      if (q.id in R) return;
      if (q.type === "multi") R[q.id] = { choix: [], autre: "" };
      else if (q.type === "groupe") R[q.id] = Object.fromEntries(q.champs.map(c => [c.id, ""]));
      else R[q.id] = "";
    });

    function sauver() { try { localStorage.setItem(cle, JSON.stringify(etat)); } catch (e) {} }
    function visible(q) { return !q.siReponse || Object.entries(q.siReponse).every(([k, v]) => v.includes(R[k])); }
    function visibles() { return toutes.filter(visible); }
    function texte(q) {
      const v = R[q.id];
      if (q.type === "multi") return [...v.choix, v.autre ? v.autre : ""].filter(Boolean).join(", ");
      if (q.type === "groupe") return q.champs.filter(c => (v[c.id] || "").trim()).map(c => (c.court || c.label) + " : " + v[c.id].trim()).join("\n");
      return (v || "").trim();
    }

    function logos(classe) {
      const d = el("div", { class: "duo" + (classe ? " " + classe : "") },
        el("img", { class: "kikina", src: "logos/kikina.svg", alt: "Kikina" }));
      if (Q.logoClient) d.append(el("span", { class: "croix", "aria-hidden": "true" }), el("img", { class: "client", src: Q.logoClient, alt: Q.client }));
      return d;
    }
    document.getElementById("duo-barre").replaceWith(Object.assign(logos(), { id: "duo-barre" }));

    // Photos : fondu enchaîné entre deux calques.
    const IM = Q.images || {};
    const aDesImages = !!(IM.accueil || Q.sections.some(sec => sec.image));
    if (aDesImages) document.getElementById("cadre").classList.remove("sans-visuel");
    const calques = [document.getElementById("img-a"), document.getElementById("img-b")];
    let calque = 0, imageCourante = "";
    function visuel(src, enQuestion) {
      document.body.classList.toggle("en-question", !!enQuestion);
      src = src || IM.accueil;
      if (!aDesImages || !src || src === imageCourante) return;
      imageCourante = src;
      const suivant = calques[1 - calque], actuel = calques[calque];
      suivant.onload = () => { suivant.classList.add("on"); actuel.classList.remove("on"); };
      suivant.src = src;
      calque = 1 - calque;
    }
    // Précharge les photos pour des transitions sans attente.
    [IM.accueil, IM.fin, ...Q.sections.map(sec => sec.image)].filter(Boolean).forEach(src => { new Image().src = src; });

    function scene(classe, ...enfants) {
      if (classe !== "question") document.body.classList.remove("nuit");
      app.innerHTML = "";
      const sc = el("div", { class: "scene entre " + (classe || "") }, ...enfants);
      app.appendChild(sc);
      window.scrollTo(0, 0);
      return sc;
    }

    function majBarre(index) {
      const v = visibles();
      if (index < 0) { barre.classList.add("cachee"); return; }
      barre.classList.remove("cachee");
      compteur.textContent = index >= v.length ? "Récapitulatif" : (index + 1) + " / " + v.length;
      progression.innerHTML = "";
      v.forEach((q, i) => {
        const seg = el("span", { class: (i < index || index >= v.length ? "fait" : "") + (i > 0 && v[i - 1]._sec !== q._sec ? " coupure" : "") });
        progression.appendChild(seg);
      });
    }

    // Accueil
    function accueil() {
      etat.pos = -1; sauver(); majBarre(-1); visuel(IM.accueil);
      const onde = el("div", { class: "onde", "aria-hidden": "true" });
      [10, 18, 28, 16, 34, 22, 40, 26, 14, 30, 20, 36, 18, 24, 12].forEach((h, i) =>
        onde.appendChild(el("i", { style: "height:" + h + "px;animation-delay:" + (i * -0.17).toFixed(2) + "s" })));
      const etapes = el("ol", { class: "etapes" });
      Q.sections.forEach((sec, i) => {
        const n = toutes.filter(q => q._sec === i).length;
        etapes.appendChild(el("li", {}, el("span", { class: "num", text: String(i + 1).padStart(2, "0") }), sec.titre,
          el("span", { class: "nb", text: n + " question" + (n > 1 ? "s" : "") })));
      });
      const dejaCommence = toutes.some(q => texte(q));
      let envoyeLe = null;
      try { envoyeLe = localStorage.getItem(cle + "-envoye"); } catch (e) {}
      // Reprendre : première question sans réponse, ou le récapitulatif si tout est rempli.
      const reprendre = () => {
        const v = visibles();
        const i = v.findIndex(q => !texte(q));
        i < 0 ? recap() : question(i);
      };
      const recommencer = () => {
        try { localStorage.removeItem(cle); localStorage.removeItem(cle + "-envoye"); } catch (e) {}
        location.reload();
      };
      let actions;
      if (dejaCommence) {
        actions = el("div", { class: "actions", style: "margin-top:0;justify-content:center" },
          el("button", { class: "bouton", type: "button", onclick: reprendre }, "Reprendre", el("span", { text: "→", "aria-hidden": "true" })),
          el("button", { class: "lien", type: "button", text: "Recommencer", onclick: recommencer }));
      } else if (envoyeLe) {
        actions = el("div", { style: "text-align:center" },
          el("p", { class: "format", style: "margin-bottom:28px", text: "Vos réponses ont bien été envoyées. Merci." }),
          el("div", { class: "actions", style: "margin-top:0;justify-content:center" },
            el("button", { class: "bouton leger", type: "button", onclick: recommencer }, "Répondre à nouveau")));
      } else {
        actions = el("div", { class: "actions", style: "margin-top:0;justify-content:center" },
          el("button", { class: "bouton", type: "button", onclick: () => question(0) }, "Commencer", el("span", { text: "→", "aria-hidden": "true" })));
      }
      scene("accueil",
        Q.accroche ? el("p", { class: "accroche", text: Q.accroche }) : null,
        logos(),
        el("h1", { text: Q.titre || Q.client }),
        el("p", { class: "format", text: toutes.length + " questions courtes" + (Q.duree ? " · " + Q.duree : "") }),
        onde,
        etapes,
        actions);
    }

    // Groupe de tuiles à choix unique (utilisé dans les questions à plusieurs champs).
    function petitesTuiles(options, valeur, auChoix) {
      const box = el("div", { class: "tuiles compactes", role: "radiogroup" });
      const ts = options.map(o => {
        const t = el("button", { type: "button", class: "tuile" + (valeur() === o ? " choisie" : ""), role: "radio", "aria-checked": String(valeur() === o) }, o);
        t.addEventListener("click", () => {
          auChoix(valeur() === o ? "" : o);
          ts.forEach((x, j) => { const on = valeur() === options[j]; x.classList.toggle("choisie", on); x.setAttribute("aria-checked", String(on)); });
        });
        return t;
      });
      box.append(...ts);
      return box;
    }

    const ICONE_CALENDRIER = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2"/></svg>';

    // Une question
    function question(index) {
      const v = visibles();
      if (index >= v.length) return recap();
      if (index < 0) return accueil();
      etat.pos = index; sauver(); majBarre(index);
      const q = v[index];
      const sec = Q.sections[q._sec];
      visuel(sec.image, true);
      document.body.classList.toggle("nuit", !!sec.nuit);
      const erreur = el("div", { class: "erreur", role: "alert" });
      const suivant = el("button", { class: "bouton", type: "button" });
      const majSuivant = () => {
        const rempli = !!texte(q);
        suivant.textContent = "";
        suivant.append(!rempli && !q.requis ? "Passer" : (etat.recapApres ? "Valider" : "Continuer"), el("span", { text: "→", "aria-hidden": "true" }));
      };
      const avancer = () => {
        if (q.requis && !texte(q)) { erreur.textContent = "Cette réponse est nécessaire pour continuer."; return; }
        sauver();
        if (etat.recapApres) { etat.recapApres = false; return recap(); }
        // Les questions visibles peuvent changer selon la réponse : on recalcule.
        const nv = visibles();
        question(nv.indexOf(q) + 1);
      };
      suivant.addEventListener("click", avancer);

      let champ;
      if (q.type === "choix" || q.type === "multi") {
        const multi = q.type === "multi";
        const libelles = q.options.map(o => typeof o === "string" ? o : o.texte);
        champ = el("div", { class: "tuiles", role: multi ? "group" : "radiogroup", "aria-label": q.label });
        const tuiles = q.options.map((opt, i) => {
          const o = libelles[i];
          const detail = typeof opt === "string" ? null : opt.detail;
          const choisie = multi ? R[q.id].choix.includes(o) : R[q.id] === o;
          const t = el("button", { type: "button", class: "tuile" + (multi ? " multi" : "") + (choisie ? " choisie" : ""), role: multi ? "checkbox" : "radio", "aria-checked": String(choisie) },
            el("span", { class: "touche", text: String.fromCharCode(65 + i) }),
            detail ? el("span", { class: "tuile-texte" }, o, el("small", { text: detail })) : o);
          t.addEventListener("click", () => choisir(i));
          return t;
        });
        champ.append(...tuiles);
        function choisir(i) {
          const o = libelles[i];
          if (multi) {
            const c = R[q.id].choix;
            c.includes(o) ? c.splice(c.indexOf(o), 1) : c.push(o);
            R[q.id].choix = libelles.filter(x => c.includes(x));
          } else {
            R[q.id] = R[q.id] === o ? "" : o;
          }
          tuiles.forEach((t, j) => {
            const on = multi ? R[q.id].choix.includes(libelles[j]) : R[q.id] === libelles[j];
            t.classList.toggle("choisie", on); t.setAttribute("aria-checked", String(on));
          });
          sauver(); majSuivant(); erreur.textContent = "";
          if (!multi && R[q.id]) setTimeout(avancer, 380);
        }
        if (q.autre) {
          const autre = el("input", { class: "saisie", type: "text", placeholder: "Autre, précisez", "aria-label": "Autre" });
          autre.value = R[q.id].autre || "";
          autre.addEventListener("input", () => { R[q.id].autre = autre.value; sauver(); majSuivant(); });
          autre.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); avancer(); } e.stopPropagation(); });
          champ.appendChild(el("div", { class: "autre" }, autre));
        }
        clavier = e => {
          if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
          const i = e.key.toUpperCase().charCodeAt(0) - 65;
          if (e.key.length === 1 && i >= 0 && i < q.options.length) { e.preventDefault(); choisir(i); }
          else if (e.key === "Enter" && multi) { e.preventDefault(); avancer(); }
        };
      } else if (q.type === "groupe") {
        champ = el("ol", { class: "groupe" });
        q.champs.forEach((c, k) => {
          const set = val => { R[q.id][c.id] = val; sauver(); majSuivant(); erreur.textContent = ""; };
          let saisie;
          if (c.type === "choix") {
            saisie = petitesTuiles(c.options, () => R[q.id][c.id], set);
          } else {
            saisie = el("input", { class: "saisie", type: "text", "aria-label": c.label, placeholder: c.placeholder || "" });
            saisie.value = R[q.id][c.id] || "";
            saisie.addEventListener("input", () => set(saisie.value));
            saisie.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); avancer(); } });
          }
          champ.appendChild(el("li", {}, el("p", { class: "groupe-label" }, el("span", { text: String.fromCharCode(97 + k) }), c.label), saisie));
        });
        clavier = null;
      } else {
        const long = q.type === "texte-long";
        champ = el(long ? "textarea" : "input", { class: "saisie", "aria-label": q.label });
        if (!long) champ.type = "text";
        if (q.placeholder) champ.placeholder = q.placeholder;
        champ.value = R[q.id] || "";
        champ.addEventListener("input", () => { R[q.id] = champ.value; sauver(); majSuivant(); erreur.textContent = ""; });
        champ.addEventListener("keydown", e => {
          if (e.key === "Enter" && (!long || e.metaKey || e.ctrlKey)) { e.preventDefault(); avancer(); }
        });
        clavier = null;
        if (q.icone === "calendrier") {
          const ic = el("span", { class: "icone" }); ic.innerHTML = ICONE_CALENDRIER;
          champ = el("div", { class: "avec-icone" }, ic, champ);
        }
      }
      majSuivant();

      const retour = el("button", { class: "lien", type: "button", text: "← Retour", onclick: () => { etat.recapApres = false; question(index - 1); } });
      const aide = q.type === "choix" ? "Touches A, B, C pour choisir"
        : q.type === "multi" ? "Plusieurs réponses possibles"
        : q.type === "groupe" ? "Répondez à ce qui vous concerne"
        : q.type === "texte-long" ? "⌘ + Entrée pour continuer" : "Entrée pour continuer";

      scene("question",
        el("p", { class: "surtitre" }, el("span", { class: "num", text: String(q._sec + 1).padStart(2, "0") }), sec.titre),
        el("h2", { class: (q.label.length > 90 ? "long" : "") + (q.points ? " avec-points" : "") }, q.label, q.requis ? el("span", { class: "requis", text: " *" }) : null),
        q.points ? el("ol", { class: "points" }, q.points.map((t, k) => el("li", {}, el("span", { text: String.fromCharCode(97 + k) }), t))) : null,
        champ,
        erreur,
        el("div", { class: "actions" }, suivant, retour, el("span", { class: "aide", text: aide })));
      const focus = (q.type === "texte" || q.type === "texte-long") ? app.querySelector(".saisie") : null;
      if (focus && window.matchMedia("(min-width: 561px)").matches) focus.focus({ preventScroll: true });
    }

    let clavier = null;
    document.addEventListener("keydown", e => { if (clavier) clavier(e); });

    // Récapitulatif
    function recap() {
      const v = visibles();
      etat.pos = v.length; sauver(); majBarre(v.length); clavier = null; visuel(IM.fin, true);
      const blocs = Q.sections.map((sec, i) => {
        const qs = v.filter(q => q._sec === i);
        if (!qs.length) return null;
        return el("div", { class: "recap-section" }, el("h3", { text: String(i + 1).padStart(2, "0") + " · " + sec.titre }),
          qs.map(q => {
            const t = texte(q);
            return el("div", { class: "recap-ligne" },
              el("span", { class: "ql", text: q.label }),
              el("span", { class: "rep" + (t ? "" : " vide"), text: t || "Pas de réponse" }),
              el("button", { class: "lien", type: "button", text: "Modifier", onclick: () => { etat.recapApres = true; question(visibles().indexOf(q)); } }));
          }));
      });
      const erreur = el("div", { class: "erreur", role: "alert" });
      const envoyer = el("button", { class: "bouton", type: "button" }, "Envoyer", el("span", { text: "→", "aria-hidden": "true" }));
      envoyer.addEventListener("click", () => envoi(envoyer, erreur));
      // Prénom facultatif : pour savoir qui a répondu quand plusieurs personnes remplissent le questionnaire.
      const prenom = el("input", { class: "saisie", type: "text", id: "prenom", placeholder: "Facultatif", autocomplete: "given-name" });
      prenom.value = etat.prenom || "";
      prenom.addEventListener("input", () => { etat.prenom = prenom.value; sauver(); });
      prenom.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); envoi(envoyer, erreur); } });
      scene("recap",
        el("p", { class: "surtitre", text: "Avant d'envoyer" }),
        el("h2", { text: "Vos réponses" }),
        blocs,
        el("div", { class: "prenom" }, el("label", { for: "prenom", text: "Votre prénom" }), prenom),
        erreur,
        el("div", { class: "actions" }, envoyer, el("button", { class: "lien", type: "button", text: "← Retour", onclick: () => question(v.length - 1) })));
    }

    async function envoi(bouton, erreur) {
      const v = visibles();
      const manquante = v.find(q => q.requis && !texte(q));
      if (manquante) { etat.recapApres = true; return question(v.indexOf(manquante)); }
      const qui = (etat.prenom || "").trim();
      const sujet = "Questionnaire " + Q.client + " · " + (qui ? "réponses " + (/^[aeiouyhàâäéèêëîïôöûü]/i.test(qui) ? "d'" : "de ") + qui : "nouvelles réponses");
      const corpsTexte = (qui ? "Prénom\n" + qui + "\n\n" : "") + v.map(q => q.label + "\n" + (texte(q) || "(pas de réponse)")).join("\n\n");
      if (!CFG.envoiAutomatique) return secours(sujet, corpsTexte);
      bouton.disabled = true;
      const corps = { _subject: sujet, _template: "box", _captcha: "false", Questionnaire: Q.client, "Prénom": qui || "(non précisé)" };
      v.forEach(q => {
        if (q.type === "groupe") q.champs.forEach(c => { corps[q.label + " " + c.label] = (R[q.id][c.id] || "").trim() || "(pas de réponse)"; });
        else corps[q.label] = texte(q) || "(pas de réponse)";
      });
      try {
        const rep = await fetch(CFG.envoiAutomatique, {
          method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(corps)
        });
        const json = await rep.json().catch(() => ({}));
        if (!rep.ok || json.success === false || json.success === "false") throw new Error("envoi");
        try { localStorage.removeItem(cle); localStorage.setItem(cle + "-envoye", new Date().toISOString()); } catch (e) {}
        fin();
      } catch (err) {
        secours(sujet, corpsTexte);
      }
    }

    function fin() {
      majBarre(-1); clavier = null; visuel(IM.fin);
      scene("fin", logos(), el("h2", { text: "Merci." }), Q.merci ? el("p", { text: Q.merci }) : null);
    }

    function secours(sujet, corpsTexte) {
      majBarre(-1); clavier = null; visuel(IM.fin);
      const dest = CFG.destinataire || "bianca@kikinastudio.com";
      const mailto = "mailto:" + dest + "?subject=" + encodeURIComponent(sujet) + "&body=" + encodeURIComponent(corpsTexte);
      const copier = el("button", { class: "bouton leger", type: "button", text: "Copier mes réponses" });
      copier.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(corpsTexte); copier.textContent = "Copié"; } catch (e) { copier.textContent = "Copie impossible"; }
      });
      scene("fin", logos(),
        el("h2", { text: "Dernière étape." }),
        el("p", { text: "Vos réponses sont prêtes. Ce bouton ouvre un mail déjà rempli vers " + dest + ", il suffit de l'envoyer." }),
        el("div", { class: "actions" }, el("a", { class: "bouton", href: mailto, text: "Ouvrir le mail" }), copier,
          el("button", { class: "lien", type: "button", text: "← Retour", onclick: recap })));
    }

    // À chaque ouverture : l'accueil. Il propose de reprendre si des réponses sont en cours.
    accueil();
  }
})();
</script>
</body>
</html>
