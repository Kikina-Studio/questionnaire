<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kikina · Questionnaire</title>
<style>
  @font-face { font-family: "Whyte Inktrap"; src: url("fonts/WhyteInktrap-Light.ttf") format("truetype"); font-weight: 300; font-display: swap; }
  @font-face { font-family: "Whyte Inktrap"; src: url("fonts/WhyteInktrap-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Whyte Inktrap"; src: url("fonts/WhyteInktrap-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }

  :root {
    --fond: #faf8f4;
    --texte: #111111;
    --texte-doux: #77736c;
    --ligne: #dcd8d0;
    --ligne-forte: #111111;
    --erreur: #9a3b2e;
    --police: "Whyte Inktrap", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--fond); color: var(--texte); font-family: var(--police); font-weight: 300; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .page { max-width: 640px; margin: 0 auto; padding: 40px 24px 120px; }

  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 120px; }
  .logo { font-weight: 400; font-size: 15px; letter-spacing: .02em; }
  .tag { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--texte-doux); }

  h1 { font-weight: 300; font-size: clamp(30px, 6vw, 40px); line-height: 1.15; margin: 0 0 96px; letter-spacing: -.01em; }
  .intro { color: var(--texte-doux); max-width: 52ch; margin: -64px 0 96px; }

  .section { margin: 0 0 88px; }
  .section-titre { display: flex; align-items: baseline; gap: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--ligne); margin-bottom: 44px; }
  .section-titre .num { font-size: 12px; color: var(--texte-doux); letter-spacing: .1em; }
  .section-titre h2 { font-weight: 400; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin: 0; }

  .q { margin: 0 0 48px; }
  .q[hidden] { display: none; }
  .q-label { display: block; font-size: 17px; font-weight: 300; margin-bottom: 18px; max-width: 56ch; }
  .q-label .requis { color: var(--texte-doux); }

  input[type=text], textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--texte); background: transparent;
    border: 0; border-bottom: 1px solid var(--ligne); border-radius: 0; padding: 10px 0; outline: none; transition: border-color .2s;
  }
  textarea { min-height: 88px; resize: vertical; }
  input[type=text]::placeholder, textarea::placeholder { color: #b3aea5; }
  input[type=text]:focus, textarea:focus { border-bottom-color: var(--ligne-forte); }

  .options { display: flex; flex-direction: column; gap: 2px; }
  .opt { position: relative; display: block; }
  .opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .opt span { display: flex; align-items: center; gap: 14px; padding: 8px 0; font-size: 16px; cursor: pointer; user-select: none; color: var(--texte-doux); transition: color .2s; }
  .opt span::before { content: ""; flex: none; width: 12px; height: 12px; border: 1px solid #a9a49b; border-radius: 50%; transition: all .2s; }
  .opt input[type=checkbox] + span::before { border-radius: 0; }
  .opt:hover span { color: var(--texte); }
  .opt input:checked + span { color: var(--texte); }
  .opt input:checked + span::before { background: var(--texte); border-color: var(--texte); box-shadow: inset 0 0 0 2px var(--fond); }
  .opt input:focus-visible + span { outline: 1px solid var(--texte); outline-offset: 4px; }
  .autre-champ { margin-top: 8px; }

  .envoi { padding-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }
  button {
    font: inherit; font-size: 12px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
    color: var(--fond); background: var(--texte); border: 1px solid var(--texte); border-radius: 0; padding: 18px 36px; transition: opacity .2s;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: wait; }
  button.secondaire { background: transparent; color: var(--texte); }
  .note { font-size: 13px; color: var(--texte-doux); }
  .erreur { color: var(--erreur); font-size: 14px; width: 100%; }

  .fin p { color: var(--texte-doux); max-width: 52ch; margin: -64px 0 0; }
  .fin .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px; }
  .fin a.bouton { display: inline-block; text-decoration: none; color: var(--fond); background: var(--texte); padding: 18px 36px; font-size: 12px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; }

  footer { margin-top: 140px; padding-top: 20px; border-top: 1px solid var(--ligne); font-size: 12px; color: var(--texte-doux); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  footer a { color: inherit; text-decoration: none; }

  @media (max-width: 520px) {
    .page { padding: 28px 20px 96px; }
    header { margin-bottom: 72px; }
    h1 { margin-bottom: 64px; }
    button, .fin a.bouton { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="logo">Kikina</div>
    <div class="tag" id="tag"></div>
  </header>

  <main id="app">
    <p class="note">Chargement…</p>
  </main>

  <footer>
    <span>Composé avec des neuroscientifiques</span>
    <a href="https://kikina.fr" target="_blank" rel="noopener">kikina.fr</a>
  </footer>
</div>

<script src="config.js"></script>
<script>
(function () {
  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  const id = (params.get("q") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");

  if (!id) { app.innerHTML = '<p class="intro">Ce lien est incomplet. Écrivez-nous à <a style="color:inherit" href="mailto:bianca@kikinastudio.com">bianca@kikinastudio.com</a>.</p>'; return; }

  const s = document.createElement("script");
  s.src = "questionnaires/" + id + ".js";
  s.onload = () => window.QUESTIONNAIRE ? demarrer(window.QUESTIONNAIRE) : introuvable();
  s.onerror = introuvable;
  document.body.appendChild(s);

  function introuvable() {
    app.innerHTML = '<p class="intro">Ce questionnaire n\'existe plus ou le lien est incorrect. Écrivez-nous à <a style="color:inherit" href="mailto:bianca@kikinastudio.com">bianca@kikinastudio.com</a>.</p>';
  }

  function el(tag, attrs, ...enfants) {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    enfants.flat().forEach(c => c && n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return n;
  }

  function demarrer(Q) {
    const CFG = window.KIKINA_CONFIG || {};
    const cleBrouillon = "kikina-questionnaire-" + Q.id;
    document.title = "Kikina · " + Q.client;
    document.getElementById("tag").textContent = Q.client;

    const questions = Q.sections.flatMap(sec => sec.questions);
    let brouillon = {};
    try { brouillon = JSON.parse(localStorage.getItem(cleBrouillon) || "{}"); } catch (e) {}

    app.innerHTML = "";
    app.appendChild(el("h1", { text: Q.titre || Q.bonjour || "Quelques questions" }));
    if (Q.intro) app.appendChild(el("p", { class: "intro", text: Q.intro }));

    const form = el("form", { novalidate: "" });
    Q.sections.forEach((sec, i) => {
      const bloc = el("section", { class: "section" },
        el("div", { class: "section-titre" },
          el("span", { class: "num", text: String(i + 1).padStart(2, "0") }),
          el("h2", { text: sec.titre })));
      sec.questions.forEach(q => bloc.appendChild(champ(q)));
      form.appendChild(bloc);
    });

    const erreur = el("div", { class: "erreur", role: "alert" });
    const bouton = el("button", { type: "submit", text: "Envoyer" });
    form.appendChild(el("div", { class: "envoi" }, bouton,
      erreur));
    app.appendChild(form);

    function champ(q) {
      const wrap = el("div", { class: "q", "data-id": q.id });
      const lid = "q-" + q.id;
      const label = el(q.type === "choix" || q.type === "multi" ? "div" : "label", { class: "q-label", for: lid, id: lid + "-label" }, q.label);
      if (q.requis) label.appendChild(el("span", { class: "requis", text: " *" }));
      wrap.appendChild(label);
      const val = brouillon[q.id];

      if (q.type === "texte" || q.type === "texte-long") {
        const input = q.type === "texte" ? el("input", { type: "text", id: lid, name: q.id }) : el("textarea", { id: lid, name: q.id });
        if (q.placeholder) input.placeholder = q.placeholder;
        if (typeof val === "string") input.value = val;
        wrap.appendChild(input);
      } else {
        const multi = q.type === "multi";
        const opts = el("div", { class: "options", role: multi ? "group" : "radiogroup", "aria-labelledby": lid + "-label" });
        const choisies = multi ? (val && val.choix) || [] : [val];
        q.options.forEach(o => {
          const input = el("input", { type: multi ? "checkbox" : "radio", name: q.id, value: o });
          if (choisies.includes(o)) input.checked = true;
          opts.appendChild(el("label", { class: "opt" }, input, el("span", { text: o })));
        });
        wrap.appendChild(opts);
        if (q.autre) {
          const autre = el("input", { type: "text", class: "autre-champ", name: q.id + "__autre", placeholder: "Autre, précisez", "aria-label": "Autre objectif" });
          if (val && val.autre) autre.value = val.autre;
          wrap.appendChild(autre);
        }
        if (!multi) {
          // Un second clic sur une option déjà cochée la décoche.
          opts.addEventListener("click", e => {
            const r = e.target.closest("input[type=radio]");
            if (!r) return;
            if (r.dataset.etait === "1") { r.checked = false; r.dataset.etait = ""; form.dispatchEvent(new Event("input")); }
            else opts.querySelectorAll("input").forEach(x => x.dataset.etait = x === r ? "1" : "");
          });
          opts.querySelectorAll("input:checked").forEach(x => x.dataset.etait = "1");
        }
      }
      return wrap;
    }

    function lire() {
      const fd = new FormData(form), r = {};
      questions.forEach(q => {
        if (q.type === "multi") r[q.id] = { choix: fd.getAll(q.id), autre: (fd.get(q.id + "__autre") || "").trim() };
        else r[q.id] = (fd.get(q.id) || "").toString().trim();
      });
      return r;
    }

    function visible(q, r) {
      if (!q.siReponse) return true;
      return Object.entries(q.siReponse).every(([k, vals]) => vals.includes(r[k]));
    }

    function maj() {
      const r = lire();
      questions.forEach(q => { form.querySelector('[data-id="' + q.id + '"]').hidden = !visible(q, r); });
      try { localStorage.setItem(cleBrouillon, JSON.stringify(r)); } catch (e) {}
    }
    form.addEventListener("input", maj);
    form.addEventListener("change", maj);
    maj();

    function texteReponse(q, v) {
      if (q.type === "multi") return [...v.choix, v.autre ? "Autre : " + v.autre : ""].filter(Boolean).join(", ");
      return v;
    }

    function recap(r) {
      return questions.filter(q => visible(q, r)).map(q => {
        const t = texteReponse(q, r[q.id]);
        return q.label + "\n" + (t || "(pas de réponse)");
      }).join("\n\n");
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      erreur.textContent = "";
      const r = lire();
      const manquante = questions.find(q => q.requis && visible(q, r) && !texteReponse(q, r[q.id]));
      if (manquante) {
        erreur.textContent = "Il manque : " + manquante.label.toLowerCase();
        const n = form.querySelector('[data-id="' + manquante.id + '"] input, [data-id="' + manquante.id + '"] textarea');
        n && n.focus();
        return;
      }
      const sujet = "Questionnaire " + Q.client + " · réponses de " + (r.nom || "un client");
      if (!CFG.envoiAutomatique) return finir(false, sujet, recap(r));

      bouton.disabled = true; bouton.textContent = "Envoi";
      const corps = { _subject: sujet, _template: "box", _captcha: "false", Questionnaire: Q.client };
      questions.filter(q => visible(q, r)).forEach(q => { corps[q.label] = texteReponse(q, r[q.id]) || "(pas de réponse)"; });
      try {
        const rep = await fetch(CFG.envoiAutomatique, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(corps)
        });
        const json = await rep.json().catch(() => ({}));
        if (!rep.ok || json.success === false || json.success === "false") throw new Error("envoi");
        finir(true);
      } catch (err) {
        finir(false, sujet, recap(r));
      }
    });

    function finir(envoye, sujet, texte) {
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (envoye) {
        try { localStorage.removeItem(cleBrouillon); } catch (e) {}
        app.innerHTML = "";
        app.appendChild(el("h1", { text: "Merci." }));
        if (Q.merci) app.appendChild(el("div", { class: "fin" }, el("p", { text: Q.merci })));
        return;
      }
      const dest = CFG.destinataire || "bianca@kikinastudio.com";
      const mailto = "mailto:" + dest + "?subject=" + encodeURIComponent(sujet) + "&body=" + encodeURIComponent(texte);
      const copier = el("button", { type: "button", class: "secondaire", text: "Copier mes réponses" });
      copier.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(texte); copier.textContent = "Copié"; } catch (e) { copier.textContent = "Copie impossible"; }
      });
      const retour = el("button", { type: "button", class: "secondaire", text: "Modifier" });
      retour.addEventListener("click", () => demarrer(Q));
      app.innerHTML = "";
      app.appendChild(el("h1", { text: "Dernière étape." }));
      app.appendChild(el("div", { class: "fin" },
        el("p", { text: "Vos réponses sont prêtes. Le bouton ci-dessous ouvre un mail déjà rempli vers " + dest + ", il suffit de l'envoyer." }),
        el("div", { class: "actions" }, el("a", { class: "bouton", href: mailto, text: "Ouvrir le mail" }), copier, retour)));
    }
  }
})();
</script>
</body>
</html>
